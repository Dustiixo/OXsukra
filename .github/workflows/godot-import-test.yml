name: Godot native import and gameplay logic smoke
on:
  push:
  pull_request:
jobs:
  godot-import-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download pinned official Godot 4.7.2 engine
        shell: bash
        run: |
          curl -fL --retry 3 --output /tmp/godot.zip 'https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip'
          echo 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4  /tmp/godot.zip' | sha256sum -c -
          unzip -q /tmp/godot.zip -d /tmp
          chmod +x /tmp/Godot_v4.7.2-stable_linux.x86_64
          echo '/tmp' >> "$GITHUB_PATH"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install content test requirement
        run: python -m pip install Pillow
      - name: Python content validation
        run: python3 tests/test_content.py
      - name: Import native project and compile scripts
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Isolated Godot integration smoke
        run: /tmp/Godot_v4.7.2-stable_linux.x86_64 --headless --path . --script res://tests/test_godot.gd -- --isolated-test
