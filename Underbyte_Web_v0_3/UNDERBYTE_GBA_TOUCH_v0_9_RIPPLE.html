<title>UNDERBYTE — Pocket Adventure · Pulse Radar v0.3</title>
<style>
:root{color-scheme:dark;--ink:#d6e6e9;--dim:#94b6bf;--edge:#485971;--panel:#171c2f;--accent:#6de7d7}
*{box-sizing:border-box;touch-action:manipulation}

body{background:radial-gradient(ellipse at 50% 30%,#222841,#0c1020 75%);color:var(--ink);font-family:ui-monospace,Consolas,Menlo,monospace;user-select:none;-webkit-user-select:none}
.shell{margin:auto;max-width:1100px;height:100%;height:100dvh;display:flex;flex-direction:column;padding:calc(5px + env(safe-area-inset-top)) calc(6px + env(safe-area-inset-right)) calc(5px + env(safe-area-inset-bottom)) calc(6px + env(safe-area-inset-left));gap:5px}
.top{display:flex;justify-content:space-between;align-items:center;min-height:36px;gap:6px;padding:0 5px}
.logo{font-size:clamp(15px,4vw,22px);font-weight:1000;letter-spacing:.09em;color:#a9f0e5;text-shadow:2px 2px #355575;white-space:nowrap}
.eyebrow{font-size:9px;letter-spacing:.12em;color:#95acc8;white-space:nowrap}
.top-actions{display:flex;gap:6px;align-items:center}
.top-actions button,.tiny{font-family:inherit;background:#192539;color:#dde9e6;border:1px solid #546a81;border-radius:6px;padding:6px 9px;font-size:10px;min-height:30px}
.stage{flex:1;min-height:0;display:grid;grid-template-areas:'screen screen' 'left right';grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto 220px;gap:8px;align-items:center;align-content:start}
.screen{grid-area:screen;position:relative;width:100%;max-width:720px;aspect-ratio:3/2;margin:0 auto;align-self:start;border:4px solid #465573;border-radius:9px;box-shadow:0 0 0 2px #111a2a,0 10px 28px #02040bd6,inset 0 0 12px #000;overflow:hidden;background:#121e31;touch-action:none}
.screen:after{content:'';position:absolute;inset:0;pointer-events:none;border:1px solid #91a1b6aa;border-radius:3px;box-shadow:inset 0 0 10px #06112670}
canvas{width:100%;height:100%;display:block;image-rendering:pixelated;image-rendering:crisp-edges;touch-action:none}
.controls-left,.controls-right{height:220px;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;position:relative;gap:7px}
.controls-left{grid-area:left}.controls-right{grid-area:right}
.shoulder{min-width:83px;min-height:35px;border:1px solid #70809c;border-bottom:4px solid #3d516a;border-radius:10px 10px 5px 5px;background:linear-gradient(#36425d,#1c2742);color:#d7e1e9;font:900 13px ui-monospace,monospace;touch-action:none}
.dpad{width:min(100%,150px);aspect-ratio:1;display:grid;grid-template-columns:repeat(3,1fr);grid-template-rows:repeat(3,1fr);gap:0;touch-action:none;margin:0}
.d{border:1px solid #52637e;background:linear-gradient(#354057,#1a2439);color:#d4e6e9;display:flex;justify-content:center;align-items:center;font:900 clamp(17px,5vw,25px) system-ui;touch-action:none;-webkit-tap-highlight-color:transparent;padding:0}
.d.up{grid-area:1/2/2/3;border-radius:9px 9px 2px 2px}.d.left{grid-area:2/1/3/2;border-radius:9px 2px 2px 9px}.d.middle{grid-area:2/2/3/3;background:#202b41;border-radius:2px;pointer-events:none}.d.right{grid-area:2/3/3/4;border-radius:2px 9px 9px 2px}.d.down{grid-area:3/2/4/3;border-radius:2px 2px 9px 9px}
.d:active,.d.pressed,.ab:active,.ab.pressed,.shoulder:active,.shoulder.pressed,.start:active{background:#4e6e75;transform:translateY(1px);filter:brightness(1.2)}
.abpad{margin:22px 0 0;display:flex;align-items:center;justify-content:center;gap:13px;width:100%;min-height:100px;touch-action:none}
.ab{font:900 22px ui-monospace,monospace;color:#f6edf9;border:2px solid #b08faa;border-bottom:5px solid #543958;background:linear-gradient(130deg,#91546e,#5a375b);border-radius:50%;width:clamp(59px,17vw,78px);height:clamp(59px,17vw,78px);box-shadow:0 4px 8px #0005;touch-action:none}
.ab.b{transform:translateY(15px)}.ab.b:active,.ab.b.pressed{transform:translateY(16px)}
.caption{color:#9eb4bf;font-size:10px;line-height:1.25;text-align:center;min-height:15px;margin-top:auto}
.foot{min-height:20px;display:flex;align-items:center;justify-content:space-between;gap:4px;color:#98b9bd;padding:0 5px;font-size:9px}
.foot b{color:#c4e5dc}
@media (orientation:landscape) and (max-height:620px){
 .shell{padding-top:2px;padding-bottom:2px;gap:3px}.top{min-height:24px}.logo{font-size:15px}.eyebrow{display:none}.top-actions button{padding:3px 7px;min-height:23px}
 .stage{grid-template-areas:'left screen right';grid-template-columns:minmax(130px,1fr) minmax(0,calc((100dvh - 54px)*1.5)) minmax(130px,1fr);grid-template-rows:minmax(0,1fr);gap:7px;align-content:stretch}
 .screen{width:100%;max-height:calc(100dvh - 53px);align-self:center;justify-self:center;border-width:3px}
 .controls-left,.controls-right{height:100%;min-height:0;align-self:stretch;justify-content:space-around}
 .dpad{width:min(145px,90%);max-height:min(145px,65%)}.shoulder{min-height:28px;min-width:75px}.abpad{margin:0;gap:4px;min-height:0}.ab{width:clamp(50px,7.5vw,70px);height:clamp(50px,7.5vw,70px)}
 .caption{font-size:9px;min-height:10px}.foot{font-size:8px;min-height:12px}
}
@media(max-width:365px){.top-actions button{padding:4px 5px;font-size:9px}.logo{font-size:15px}.stage{gap:5px}.dpad{max-width:142px}.abpad{gap:4px}}
</style>
</head>
<body>
<div class="shell">
 <header class="top">
  <div><div class="logo">UNDERBYTE <span style="color:#b99ee4">▣</span></div><div class="eyebrow">THE QUIET EDGE · FIRST PLAYABLE</div></div>
  <div class="top-actions"><button type="button" id="mapBtn" aria-label="Open world map">MAP</button><button type="button" id="journalBtn" aria-label="Open quest journal">LOG</button><button type="button" id="selectBtn" aria-label="Character and journal">SELECT</button><button type="button" id="startBtn" aria-label="Pause or resume">START</button><button type="button" id="fsBtn" aria-label="Fullscreen">⛶</button></div>
 </header>
 <main class="stage">
  <section class="screen" aria-label="UNDERBYTE interactive pixel game screen"><canvas id="game" width="240" height="160" aria-label="Playable Underbyte side-scrolling world"></canvas></section>
  <div class="controls-left">
   <button class="shoulder" id="lBtn" aria-label="Dash">L · DASH</button>
   <div class="dpad" aria-label="Directional buttons">
    <button class="d up" id="upBtn" aria-label="Talk or use">▲</button><button class="d left" id="leftBtn" aria-label="Move left">◀</button><div class="d middle"></div><button class="d right" id="rightBtn" aria-label="Move right">▶</button><button class="d down" id="downBtn" aria-label="Crouch">▼</button>
   </div>
   <span class="caption">MOVE · ▲ TALK / USE</span>
  </div>
  <div class="controls-right">
   <button class="shoulder" id="rBtn" aria-label="Scan for secrets">R · SCAN</button>
   <div class="abpad"><button class="ab b" id="bBtn" aria-label="Swing or mine">B</button><button class="ab a" id="aBtn" aria-label="Jump">A</button></div>
   <span class="caption">B SWING / MINE · A JUMP</span>
  </div>
 </main>
 <div class="foot"><span><b>16-BIT-STYLE ORIGINAL GAME</b> · offline</span><span id="saveStatus">AUTOSAVE READY</span></div>
</div>
<script>
(()=>{'use strict';
const C=document.getElementById('game'),g=C.getContext('2d',{alpha:false});g.imageSmoothingEnabled=false;
const W=240,H=160,LEVEL=1400,GROUND=128,STORE='underbyte-pixel-v02',SCAN_RANGE=320,SCAN_SECONDS=4;
const $=id=>document.getElementById(id); const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const input={left:false,right:false,down:false};
let frame=0,cam=0,last=performance.now(),time=0,flash=0,worldStarted=true,menu='',notice='',noticeUntil=0,savePossible=true;
let particles=[],attacking=0,scanning=0,scanSelection=0,scanOrigin=null,scanSignature=null,shake=0;
let waypoint=null; // Navigation-only marker; never changes player, quest, or combat state.
const colors=[{hair:'#33354c',scarf:'#f16779',coat:'#568db6'},{hair:'#b8a78f',scarf:'#57e5bf',coat:'#765c9c'},{hair:'#b34b67',scarf:'#ffd177',coat:'#3c769e'},{hair:'#d9e7f0',scarf:'#bd8af5',coat:'#4b617f'}];
const ores=[{x:330,id:1},{x:486,id:2},{x:734,id:3}];
const enemies=[{x:424,origin:424,hp:2,alive:true,phase:0},{x:673,origin:673,hp:2,alive:true,phase:2},{x:1085,origin:1085,hp:3,alive:true,phase:4}];
const platform=[{x:278,y:101,w:54},{x:448,y:100,w:56},{x:677,y:96,w:56},{x:787,y:101,w:80},{x:1054,y:96,w:65},{x:1200,y:102,w:68}];
const p={x:52,y:GROUND,vx:0,vy:0,dir:1,hp:3,inv:0,grounded:true,ore:0,mined:[],relay:false,device:false,npc:false,palette:0,death:0};
function msg(s,secs=3.3){notice=s;noticeUntil=time+secs}
function save(){try{localStorage.setItem(STORE,JSON.stringify({x:p.x,y:p.y,hp:p.hp,ore:p.ore,mined:p.mined,relay:p.relay,device:p.device,npc:p.npc,palette:p.palette,death:p.death,enemies:enemies.map(e=>e.alive)}));$('saveStatus').textContent='SAVED • LOCAL';savePossible=true;return true}catch(_){savePossible=false;$('saveStatus').textContent='SAVE UNAVAILABLE';return false}}
function load(){try{let raw=localStorage.getItem(STORE);if(!raw)return;let s=JSON.parse(raw);for(let key of ['x','y','hp','ore','palette','death'])if(typeof s[key]==='number')p[key]=s[key];for(let key of ['relay','device','npc'])if(typeof s[key]==='boolean')p[key]=s[key];if(Array.isArray(s.mined))p.mined=s.mined.filter(x=>Number.isInteger(x));if(Array.isArray(s.enemies))s.enemies.forEach((x,i)=>{if(enemies[i])enemies[i].alive=Boolean(x)});p.x=clamp(p.x,20,LEVEL-25);p.y=clamp(p.y,0,GROUND);p.hp=clamp(p.hp,1,3);p.palette=((p.palette%colors.length)+colors.length)%colors.length;$('saveStatus').textContent='SAVE LOADED'}catch(_){}}
load();
const rand=n=>{let v=Math.sin(n*128.71+8.7)*43758.5453;return v-Math.floor(v)};
function rect(x,y,w,h,c){g.fillStyle=c;g.fillRect(Math.round(x),Math.round(y),Math.round(w),Math.round(h))}
function line(x1,y1,x2,y2,c){g.strokeStyle=c;g.lineWidth=1;g.beginPath();g.moveTo(x1+.5,y1+.5);g.lineTo(x2+.5,y2+.5);g.stroke()}
function text(s,x,y,size=7,col='#e8e9e6',align='left'){g.font='bold '+size+'px monospace';g.textBaseline='top';g.textAlign=align;g.fillStyle='#0b1524';g.fillText(s,x+1,y+1);g.fillStyle=col;g.fillText(s,x,y);g.textAlign='left'}
function sparks(x,y,c='#9ce9d6',count=9){for(let i=0;i<count;i++){let a=i*6.28/count+rand(frame+i),sp=30+rand(i*7+frame)*40;particles.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-25,life:.3+rand(i)*.5,color:c})}}
function solidAt(x){return !(x>566&&x<608)}
function objective(){if(p.ore<3)return 'FIND 3 SPARK SHARDS';if(!p.relay)return 'ACTIVATE THE OLD RELAY';if(!p.device)return 'FOLLOW THE SIGNAL';return 'A DOOR FROM INSIDE...'}
function moveUpdate(dt){if(menu)return;time+=dt;frame++;
 const dir=(input.right?1:0)-(input.left?1:0);p.vx=dir*(input.down?23:68);if(dir)p.dir=dir;
 const oldY=p.y;p.x=clamp(p.x+p.vx*dt,10,LEVEL-8);
 p.vy=clamp(p.vy+390*dt,-300,230);p.y+=p.vy*dt;
 let atGround=solidAt(p.x)&&p.y>=GROUND;
 let platformHit=false;
 if(p.vy>=0)for(const b of platform){if(p.x+6>=b.x&&p.x-6<=b.x+b.w&&oldY<=b.y+2&&p.y>=b.y){p.y=b.y;p.vy=0;p.grounded=true;platformHit=true;break}}
 if(!platformHit&&atGround){p.y=GROUND;p.vy=0;p.grounded=true}else if(!platformHit)p.grounded=false;
 if(p.y>170){p.death++;p.hp=Math.max(1,p.hp-1);p.x=clamp(p.x-105,35,LEVEL-100);p.y=60;p.vy=0;p.inv=1.5;shake=6;msg('WATCH YOUR STEP!  -1 HEART',2.2);save()}
 if(p.inv>0)p.inv-=dt;
 attacking=Math.max(0,attacking-dt);scanning=Math.max(0,scanning-dt);shake=Math.max(0,shake-dt*10);
 for(let i=0;i<enemies.length;i++){let e=enemies[i];if(!e.alive)continue;e.x=e.origin+Math.sin(time*1.3+e.phase)*19;if(Math.abs(e.x-p.x)<11&&Math.abs(p.y-GROUND)<18&&p.inv<=0){p.hp--;p.inv=1.4;p.vy=-75;p.x-=p.dir*9;shake=3;msg('Ouch. The little thing bites!',2);if(p.hp<=0){p.hp=3;p.x=52;p.y=90;msg('RESPAWNED AT THE QUIET EDGE',2.5)}save()}}
 for(let i=particles.length-1;i>=0;i--){const q=particles[i];q.life-=dt;q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=110*dt;if(q.life<=0)particles.splice(i,1)}
 cam=clamp(p.x-84,0,LEVEL-W);
}
function jump(){if(menu==='palette'){menu='';save();return}if(menu)return;if(p.grounded){p.vy=-175;p.grounded=false;sparks(p.x,p.y,'#cfe6de',4)}}
function swing(){if(menu)return;attacking=.22;let hit=false;for(const o of ores){if(p.mined.includes(o.id))continue;if(Math.abs(o.x-p.x)<22&&Math.abs(p.y-GROUND)<38){p.mined.push(o.id);p.ore++;sparks(o.x,GROUND-13,'#82f4dc',14);hit=true;msg('SPARK SHARD '+p.ore+'/3');save();break}}
 for(const e of enemies){if(!e.alive||Math.abs(e.x-p.x)>21||Math.abs(p.y-GROUND)>24)continue;e.hp--;sparks(e.x,GROUND-10,'#ff9d9e',10);hit=true;if(e.hp<=0){e.alive=false;msg('SCRAPLING DEFEATED');save()}else msg('HIT! THE SCRAPLING RECOILS',1.5)}
 if(!hit)sparks(p.x+p.dir*13,p.y-13,'#a8cdf4',2)
}
function interact(){if(menu==='pause'){menu='';return}if(menu==='palette'){menu='';save();return}if(menu)return;
 if(Math.abs(p.x-193)<28){p.npc=true;msg('MOSS: "He came from INSIDE the screen.\nNobody knows what he is looking for."',5);save();return}
 if(Math.abs(p.x-904)<29){if(p.ore>=3){p.relay=true;sparks(904,107,'#f8d894',20);msg('RELAY ONLINE! A DISTANT PATH OPENS.',4);save()}else msg('RELAY NEEDS 3 SPARK SHARDS',3);return}
 if(Math.abs(p.x-1269)<34){if(p.relay){p.device=true;sparks(1269,109,'#81e7ff',20);msg('YOU FOUND: THE ECHO KEY.\nWhy does it recognize you?',5);save()}else msg('THE DEVICE HAS NO POWER YET.',3);return}
 if(Math.abs(p.x-1360)<35){msg(p.device?'THE GATE REMEMBERS YOU.  END OF DEMO.':'THE GATE IS LOCKED. FIND THE DEVICE.',5);return}
 msg('NOTHING HERE. TRY A RUIN, CREATURE OR DEVICE.',2)
}
function dash(){if(menu)return;p.x=clamp(p.x+p.dir*35,15,LEVEL-10);sparks(p.x,p.y,'#b3c5ff',8)}
// Pulse radar is read-only: discovering a target never changes quests, enemies or saves.
function scanTargets(){
 const results=[];
 function add(kind,x,label,color){
  const dx=x-p.x;
  if(Math.abs(dx)<=SCAN_RANGE)results.push({kind,x,dx:Math.round(dx),distance:Math.round(Math.abs(dx)),label,color});
 }
 if(!p.npc)add('npc',193,'MOSS','#ecd0fa');
 for(const o of ores)if(!p.mined.includes(o.id))add('shard',o.x,'SHARD','#8cfdea');
 for(const e of enemies)if(e.alive)add('enemy',e.x,'SCRAPLING','#ff9aa3');
 if(!p.relay)add('relay',904,'RELAY','#fbe4a1');
 if(p.relay&&!p.device)add('device',1269,'ECHO KEY','#90d9ff');
 if(p.device)add('gate',1360,'GATE','#e5aaff');
 return results.sort((a,b)=>a.distance-b.distance||a.kind.localeCompare(b.kind)).slice(0,4);
}
// Long-range fallback reveals the next reachable story objective without altering progress.
function questBearing(){
 const objectives=[];
 if(!p.npc)objectives.push({x:193,label:'MOSS'});
 if(p.ore<3)for(const o of ores)if(!p.mined.includes(o.id))objectives.push({x:o.x,label:'SPARK SHARD'});
 else {} // relay remains available once all shards are collected
 if(p.ore>=3&&!p.relay)objectives.push({x:904,label:'RELAY'});
 if(p.relay&&!p.device)objectives.push({x:1269,label:'ECHO KEY'});
 if(p.device)objectives.push({x:1360,label:'GATE'});
 objectives.sort((a,b)=>Math.abs(a.x-p.x)-Math.abs(b.x-p.x));
 const target=objectives[0];
 if(!target)return null;
 const dx=Math.round(target.x-p.x);
 return {label:target.label,distance:Math.abs(dx),direction:dx<0?'WEST':dx>0?'EAST':'HERE'};
}
function scan(){
 if(menu)return;
 const targets=scanTargets();
 const signature=targets.map(t=>t.kind+":"+t.x).join("|");
 if(scanning>0&&scanOrigin!==null&&Math.abs(p.x-scanOrigin)<30&&scanSignature===signature)scanSelection++;else scanSelection=0;
 scanOrigin=p.x;scanSignature=signature;
 scanning=SCAN_SECONDS;
 if(!targets.length){const bearing=questBearing();msg(bearing?'PULSE: NO NEAR SIGNAL · NEXT '+bearing.label+' '+bearing.distance+' '+bearing.direction:'PULSE: NO SIGNAL · ALL OBJECTIVES CLEAR',3);return}
 const selected=targets[scanSelection%targets.length];
 msg('PULSE: '+selected.label+' '+selected.distance+' '+(selected.dx<0?'WEST':'EAST')+' · '+(scanSelection%targets.length+1)+'/'+targets.length,2.5);
}
function drawScan(){
 if(scanning<=0||menu)return;
 rect(23,26,194,76,'#101c31ee');rect(25,28,190,72,'#263c53');rect(26,29,188,70,'#112439');
 text('PULSE RADAR  /  320 STEPS',32,33,7,'#b1ffee');
 rect(35,55,170,1,'#608e98');rect(119,49,2,13,'#e6e3b4');
 const targets=scanTargets();
 const guidance=questBearing();if(guidance)text('QUEST '+guidance.label+' '+guidance.distance+(guidance.direction==='WEST'?'W':guidance.direction==='EAST'?'E':' HERE'),31,88,7,'#ffe4a4');
 if(!targets.length){const bearing=questBearing();text(bearing?'NEXT '+bearing.label+' '+bearing.distance+(bearing.direction==='WEST'?'W':bearing.direction==='EAST'?'E':' HERE'):'ALL OBJECTIVES CLEAR',32,69,7,'#a7b3c2');}
 for(let i=0;i<targets.length;i++){
  const target=targets[i];const x=clamp(Math.round(120+target.dx/SCAN_RANGE*82),34,206);
  rect(x-2,51,5,7,target.color);
  if(i===scanSelection%targets.length){rect(x-4,47,9,2,'#ffffff');rect(x-4,60,9,2,'#ffffff');}
  text(target.label+' '+target.distance+(target.dx<0?'W':'E'),31+(i%2)*95,64+Math.floor(i/2)*11,6,target.color);
 }
}

function togglePause(){menu=menu==='pause'?'':'pause';for(let k of Object.keys(input))input[k]=false;save()}
function toggleSelect(){menu=menu==='palette'?'':'palette';for(let k of Object.keys(input))input[k]=false;save()}
function paletteStep(d){p.palette=(p.palette+d+colors.length)%colors.length;save()}
function action(which){if(menu==='map'){if(which==='a'||which==='up'||which==='r')toggleMap();return}if(menu==='palette'){if(which==='left')paletteStep(-1);else if(which==='right')paletteStep(1);else if(which==='a'||which==='up')toggleSelect();return}
 if(menu==='pause'){if(which==='a'||which==='up')togglePause();return}
 if(which==='a')jump();else if(which==='b')swing();else if(which==='up')interact();else if(which==='l')dash();else if(which==='r')scan();}
function bg(){
 const upper=g.createLinearGradient(0,0,0,131);upper.addColorStop(0,'#19234b');upper.addColorStop(.55,'#60496b');upper.addColorStop(.86,'#c48682');upper.addColorStop(1,'#f0bf92');g.fillStyle=upper;g.fillRect(0,0,W,132);
 const moonX=188-cam*.045;rect(moonX,21,30,26,'#e6b1bf');rect(moonX+4,18,22,32,'#ecc5c0');rect(moonX+9,28,8,7,'#ce91aa');rect(moonX+3,38,7,3,'#d7a0b0');
 for(let i=0;i<34;i++){let x=(i*71-cam*.08)%270;if(x< -20)x+=270;let y=11+(i*41)%74;rect(x,y,1,1,i%4?'#e8b6c3':'#9fbbca')}
